<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <!-- Every file comes from the site root, also at sesimvar.d3asoft.com/zeki/ -->
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sesim Var" />
    <meta name="theme-color" content="#FFE9DA" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <title>Sesim Var</title>
    <script>
      // Zeki's board added to the Home Screen opens on /zeki.
      if (/^\/zeki\/?$/i.test(location.pathname))
        document.addEventListener('DOMContentLoaded', function () {
          var l = document.querySelector('link[rel="manifest"]');
          if (l) l.setAttribute('href', '/manifest-zeki.webmanifest');
        });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
